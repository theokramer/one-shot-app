name: App Store Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight upload — a half-delivered build confuses App Store
# Connect and the next run collides with it.
concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    # Dormant until the user arms it:
    #   gh variable set APP_STORE_DEPLOY_ENABLED --body true
    if: ${{ vars.APP_STORE_DEPLOY_ENABLED == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    # Add a required reviewer to this environment in repo settings to make every
    # upload need a human click.
    environment: app-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install App Store Connect key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild
          -project __APP_NAME__.xcodeproj
          -scheme __APP_NAME__
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/__APP_NAME__.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          archive

      # ExportOptions.plist sets destination=upload, so this exports and
      # delivers in one step — no separate altool/notarytool invocation.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild
          -exportArchive
          -archivePath "$RUNNER_TEMP/__APP_NAME__.xcarchive"
          -exportPath "$RUNNER_TEMP/export"
          -exportOptionsPlist ci/ExportOptions.plist
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
