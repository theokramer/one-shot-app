name: App Store Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight upload — a half-delivered build confuses App Store
# Connect and the next run collides with it.
concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    # An unset or unknown mode disables all uploads.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && vars.APP_STORE_DEPLOY_MODE == 'manual') ||
           (github.event_name == 'push' && vars.APP_STORE_DEPLOY_MODE == 'automatic')) }}
    runs-on: macos-26
    timeout-minutes: 45
    # Restrict this environment to main before adding secrets. Add a required reviewer
    # when the user requires a separate approval per deployment.
    environment: app-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install App Store Connect key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild
          -project __APP_NAME__.xcodeproj
          -scheme __APP_NAME__
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/__APP_NAME__.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          archive

      # ExportOptions.plist sets destination=upload, so this exports and
      # delivers in one step — no separate altool/notarytool invocation.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild
          -exportArchive
          -archivePath "$RUNNER_TEMP/__APP_NAME__.xcarchive"
          -exportPath "$RUNNER_TEMP/export"
          -exportOptionsPlist ci/ExportOptions.plist
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove temporary signing key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: rm -f -- "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
