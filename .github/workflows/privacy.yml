name: Privacy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test privacy protections
        run: python -B -m unittest discover -s tests -v
      - name: Scan current repository files
        env:
          ONE_SHOT_HOME: ${{ runner.temp }}/empty-privacy-profile
        run: python -B assets/scripts/package.py scan
