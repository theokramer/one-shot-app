name: Privacy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test privacy protections
        run: python -B -m unittest discover -s tests -v
      - name: Scan current repository files
        env:
          ONE_SHOT_HOME: ${{ runner.temp }}/empty-privacy-profile
        run: python -B assets/scripts/package.py scan
